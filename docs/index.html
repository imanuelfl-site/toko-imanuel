<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Toko Imanuel</title>
  <meta name="theme-color" content="#262F78">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/ikon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Terapkan tema tersimpan sebelum halaman tampil, supaya tidak berkedip.
    (function () {
      var t = null; try { t = localStorage.getItem("toko-tema"); } catch (e) {}
      var r = document.documentElement;
      if (t === "dark" || t === "light") r.setAttribute("data-theme", t);
      var gelap = t ? t === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      r.setAttribute("data-mode", gelap ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div id="app"><div class="memuat"><div class="putar"></div><span>Memuat…</span></div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
